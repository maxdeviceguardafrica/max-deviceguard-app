
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10233f">
  <title>Reset Password | Max DeviceGuard Africa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f3f6fa;
      font-family: Arial, sans-serif;
      color: #10233f;
    }

    .reset-card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 32px 24px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(16, 35, 63, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    p {
      color: #5c6878;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd3df;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #10233f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #10233f;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <h1>Set a New Password</h1>

    <p>Choose a new password for your Max DeviceGuard Africa account.</p>

    <form id="resetForm">
      <label for="password">New Password</label>
      <input
        type="password"
        id="password"
        minlength="8"
        autocomplete="new-password"
        required
        placeholder="At least 8 characters"
      >

      <label for="confirmPassword">Confirm New Password</label>
      <input
        type="password"
        id="confirmPassword"
        minlength="8"
        autocomplete="new-password"
        required
        placeholder="Enter your password again"
      >

      <button type="submit" id="resetButton">
        Reset Password
      </button>
    </form>

    <p id="message" role="status"></p>

    <a href="login.html" class="back-link">
      Back to Login
    </a>
  </main>

  <script>
    const API_URL =
      "https://max-deviceguard-api.maxshitungu.workers.dev";

    const form = document.getElementById("resetForm");
    const button = document.getElementById("resetButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const token =
        new URLSearchParams(window.location.search).get("token");

      if (!token) {
        message.textContent =
          "This reset link is missing its token. Please request a new one.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "The passwords do not match.";
        return;
      }

      if (password.length < 8) {
        message.textContent =
          "Your password must be at least 8 characters.";
        return;
      }

      button.disabled = true;
      button.textContent = "Updating Password...";
      message.textContent = "";

      try {
        const response = await fetch(
          API_URL + "/api/auth/reset-password",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              newPassword: password,
              token: token
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.message || "Password reset failed. Please request a new link."
          );
        }

        form.style.display = "none";

        message.textContent =
          "Your password has been changed successfully. You can now log in.";

        message.style.color = "green";

      } catch (error) {
        message.textContent = error.message;
        message.style.color = "#b42318";

        button.disabled = false;
        button.textContent = "Reset Password";
      }
    });
  </script>
</body>
</html>
