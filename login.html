
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10233f">
  <title>Customer Login | Max DeviceGuard Africa</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      color: #10233f;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px 26px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(16,35,63,.09);
    }

    h1 { margin: 0 0 8px; font-size: 25px; }
    .subtitle { color: #64748b; margin-bottom: 26px; }

    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #10233f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #message, #resetMessage {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #315b91;
      text-decoration: none;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: 12px;
      color: #315b91;
      font-size: 14px;
      text-decoration: none;
    }

    .reset-section {
      display: none;
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your Max DeviceGuard account.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <div style="position: relative;">
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          required
          style="padding-right: 65px;"
        >

        <button
          type="button"
          id="togglePassword"
          style="position: absolute; right: 8px; top: 50%;
          transform: translateY(-50%); width: auto; margin: 0;
          padding: 8px; background: transparent; color: #315b91;
          font-size: 13px;">
          Show
        </button>
      </div>

      <a href="#" class="forgot" id="forgotLink">
        Forgot Password?
      </a>

      <button type="submit" id="loginButton">Sign In</button>
    </form>

    <p id="message" role="status"></p>

    <section class="reset-section" id="resetSection">
      <h2>Reset Your Password</h2>
      <p class="subtitle">
        Enter your registered email address. We'll send you a password reset link.
      </p>

      <form id="resetRequestForm">
        <label for="resetEmail">Email address</label>
        <input
          type="email"
          id="resetEmail"
          autocomplete="email"
          required
        >

        <button type="submit" id="resetButton">
          Send Reset Link
        </button>
      </form>

      <p id="resetMessage" role="status"></p>
    </section>

    <a class="back" href="index.html">Back to homepage</a>
  </main>

  <script>
    const API_URL = "https://max-deviceguard-api.maxshitungu.workers.dev";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    const forgotLink = document.getElementById("forgotLink");
    const resetSection = document.getElementById("resetSection");
    const resetForm = document.getElementById("resetRequestForm");
    const resetButton = document.getElementById("resetButton");
    const resetMessage = document.getElementById("resetMessage");

    togglePassword.addEventListener("click", () => {
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePassword.textContent = "Hide";
      } else {
        passwordInput.type = "password";
        togglePassword.textContent = "Show";
      }
    });

    forgotLink.addEventListener("click", (event) => {
      event.preventDefault();

      resetSection.style.display = "block";

      document.getElementById("resetEmail").value =
        document.getElementById("email").value.trim();

      resetSection.scrollIntoView({ behavior: "smooth" });
    });

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      resetButton.disabled = true;
      resetButton.textContent = "Sending...";
      resetMessage.textContent = "";

      try {
        const response = await fetch(
          API_URL + "/api/auth/request-password-reset",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: document.getElementById("resetEmail").value.trim(),
              redirectTo: "https://max-deviceguard-app.maxshitungu.workers.dev/reset-password.html"
            })
          }
        );

        if (!response.ok) {
          throw new Error("We couldn't process your request. Please try again.");
        }

        resetMessage.style.color = "green";
        resetMessage.textContent =
          "If an account exists with that email, a password reset link will be sent. Please check your inbox.";

      } catch (error) {
        resetMessage.style.color = "#b42318";
        resetMessage.textContent = error.message;
      } finally {
        resetButton.disabled = false;
        resetButton.textContent = "Send Reset Link";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Signing in...";
      message.textContent = "";

      try {
        const response = await fetch(
          API_URL + "/api/auth/sign-in/email",
          {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: document.getElementById("email").value.trim(),
              password: document.getElementById("password").value
            })
          }
        );

        if (!response.ok) {
          throw new Error("Login failed. Check your email and password.");
        }

        message.style.color = "green";
        message.textContent = "Login successful. Opening your dashboard...";

        window.location.href = "dashboard.html";

      } catch (error) {
        message.style.color = "#b42318";
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
